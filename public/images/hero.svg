<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sea" cx="64%" cy="48%" r="80%">
      <stop offset="0" stop-color="#1F9AAC"/>
      <stop offset=".42" stop-color="#136E7E"/>
      <stop offset="1" stop-color="#071B2B"/>
    </radialGradient>
    <radialGradient id="lagoon" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#E4F7F4"/>
      <stop offset=".62" stop-color="#9EDDE0"/>
      <stop offset="1" stop-color="#4FBBC6"/>
    </radialGradient>
    <pattern id="trees" width="36" height="32" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="9" fill="#23705A"/>
      <circle cx="27" cy="24" r="8" fill="#3BA57E"/>
      <circle cx="28" cy="7" r="5" fill="#2A8468"/>
    </pattern>
    <pattern id="roofs" width="30" height="26" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="12" height="9" rx="1" fill="#FFFFFF"/>
      <rect x="18" y="13" width="9" height="9" rx="1" fill="#B9E4E8"/>
      <rect x="4" y="17" width="8" height="6" rx="1" fill="#E9DFC6"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#sea)"/>

  <!-- deep-water texture -->
  <g fill="none" stroke="#B9E4E8" stroke-opacity=".12" stroke-width="3" stroke-linecap="round">
    <path d="M80 160c40-18 80-18 120 0s80 18 120 0"/>
    <path d="M150 700c40-18 80-18 120 0s80 18 120 0 80-18 120 0"/>
    <path d="M1300 110c40-18 80-18 120 0s80 18 120 0"/>
    <path d="M320 420c30-14 60-14 90 0s60 14 90 0"/>
  </g>

  <!-- outer reef, lagoon -->
  <g transform="rotate(-10 1040 450)">
    <ellipse cx="1040" cy="450" rx="560" ry="330" fill="#1E97A8" opacity=".55"/>
    <ellipse cx="1040" cy="450" rx="500" ry="285" fill="#3AB0BD" opacity=".7"/>
    <ellipse cx="1040" cy="450" rx="440" ry="245" fill="url(#lagoon)"/>
  </g>

  <!-- small sandbank and reef patches -->
  <ellipse cx="420" cy="250" rx="120" ry="62" fill="#3AB0BD" opacity=".5"/>
  <ellipse cx="420" cy="250" rx="78" ry="36" fill="#9EDDE0" opacity=".8"/>
  <ellipse cx="424" cy="250" rx="34" ry="13" fill="#F6EFDC"/>
  <ellipse cx="300" cy="640" rx="90" ry="46" fill="#3AB0BD" opacity=".35"/>
  <ellipse cx="1480" cy="800" rx="150" ry="70" fill="#3AB0BD" opacity=".3"/>

  <!-- island: beach, vegetation, village -->
  <path d="M800 455c-12-92 100-166 240-158s252 70 247 156-124 140-254 136-222-48-233-134z" fill="#F6EFDC"/>
  <path d="M838 455c-8-72 84-130 202-124s212 56 208 124-104 112-214 108-188-40-196-108z" fill="#2F8F6B"/>
  <path d="M838 455c-8-72 84-130 202-124s212 56 208 124-104 112-214 108-188-40-196-108z" fill="url(#trees)" opacity=".9"/>
  <ellipse cx="1030" cy="450" rx="128" ry="62" fill="#E9DFC6"/>
  <ellipse cx="1030" cy="450" rx="122" ry="56" fill="url(#roofs)"/>
  <path d="M908 452h244M1030 392v118" stroke="#F6EFDC" stroke-width="5" opacity=".9"/>
  <rect x="1146" y="416" width="62" height="38" rx="5" fill="#3BA57E" stroke="#F6EFDC" stroke-width="3"/>

  <!-- harbour -->
  <path d="M960 588h150v64a14 14 0 0 1-14 14H974a14 14 0 0 1-14-14z" fill="#3AB0BD"/>
  <path d="M948 590v70c0 16 12 26 28 26h36M1122 590v70c0 16-12 26-28 26h-14" fill="none" stroke="#DAD3C0" stroke-width="9" stroke-linecap="round"/>
  <path d="M1034 590v44" stroke="#DAD3C0" stroke-width="7" stroke-linecap="round"/>
  <g fill="#FFFFFF">
    <rect x="978" y="604" width="30" height="10" rx="5"/>
    <rect x="1060" y="612" width="34" height="10" rx="5"/>
    <rect x="1050" y="640" width="26" height="9" rx="4.500"/>
  </g>

  <!-- boats with wakes -->
  <g fill="#FFFFFF">
    <path d="M620 560l44-9-4 14z"/>
    <path d="M1360 250l40-12-6 16z"/>
    <path d="M1030 760l12-34 8 34z"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="3" stroke-linecap="round">
    <path d="M612 566c-40 10-80 14-120 12"/>
    <path d="M1352 258c-36 14-70 20-104 20"/>
    <path d="M1040 770c2 30 0 54-6 76"/>
  </g>
</svg>
