<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD3DA"/>
      <stop offset="1" stop-color="#F1FAF8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A41"/>
      <stop offset="1" stop-color="#167D8D"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="950" cy="170" r="76" fill="#FFFFFF"/>
  <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity=".8">
    <path d="M950 50v-34M950 324v-34M830 170h-34M1104 170h-34M866 86l-24-24M1058 278l-24-24M1034 86l24-24M842 278l24-24"/>
  </g>
  <path d="M150 190a34 34 0 0 1 64-14 44 44 0 0 1 82 14 30 30 0 0 1 4 60H160a30 30 0 0 1-10-60z" fill="#FFFFFF" opacity=".85"/>

  <!-- sea strip and palms behind -->
  <rect y="430" width="1200" height="60" fill="#3AB0BD"/>
  <rect y="486" width="1200" height="264" fill="#F6EFDC"/>
  <g>
    <path d="M1060 500c-6-70 6-130 30-186" fill="none" stroke="#5A4636" stroke-width="12" stroke-linecap="round"/>
    <g fill="none" stroke="#2F8F6B" stroke-width="13" stroke-linecap="round">
      <path d="M1090 314c-36-34-82-34-112-6"/><path d="M1090 314c36-36 84-36 116-6"/>
      <path d="M1090 314c-22-48-62-64-98-54"/><path d="M1090 314c24-50 66-66 104-54"/>
    </g>
  </g>

  <!-- building with pitched solar roof -->
  <rect x="180" y="470" width="720" height="220" fill="#FFFFFF"/>
  <rect x="180" y="676" width="720" height="14" fill="#DAD3C0"/>
  <g fill="#B9E4E8">
    <rect x="230" y="530" width="70" height="80" rx="4"/><rect x="330" y="530" width="70" height="80" rx="4"/>
    <rect x="680" y="530" width="70" height="80" rx="4"/><rect x="780" y="530" width="70" height="80" rx="4"/>
  </g>
  <rect x="490" y="540" width="100" height="150" rx="6" fill="#071B2B"/>
  <path d="M130 480L260 300h560l130 180z" fill="#071B2B"/>
  <!-- panels -->
  <g transform="translate(290 318)">
    <path d="M0 0h500l96 140H-96z" fill="url(#panel)"/>
    <g stroke="#B9E4E8" stroke-opacity=".7" stroke-width="3" fill="none">
      <path d="M-32 46h564M-64 94h628"/>
      <path d="M100 0L44 140M200 0l-28 140M300 0l28 140M400 0l56 140"/>
    </g>
    <path d="M40 10h150l-22 30H18z" fill="#FFFFFF" opacity=".12"/>
  </g>

  <!-- inverter and cable -->
  <rect x="920" y="560" width="54" height="70" rx="6" fill="#167D8D"/>
  <circle cx="947" cy="584" r="8" fill="#B9E4E8"/>
  <path d="M900 520c20 0 46 10 46 40" fill="none" stroke="#071B2B" stroke-width="5"/>
</svg>
