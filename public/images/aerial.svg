<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD3DA"/>
      <stop offset="1" stop-color="#E9F7F6"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#167D8D"/>
      <stop offset=".5" stop-color="#3AB0BD"/>
      <stop offset="1" stop-color="#B9E4E8"/>
    </linearGradient>
    <g id="palm">
      <path d="M0 0c-4-46 4-92 22-136" fill="none" stroke="#5A4636" stroke-width="9" stroke-linecap="round"/>
      <g fill="none" stroke="#2F8F6B" stroke-width="10" stroke-linecap="round">
        <path d="M22-136c-28-26-62-26-84-4"/>
        <path d="M22-136c28-28 64-28 88-4"/>
        <path d="M22-136c-18-36-48-48-74-40"/>
        <path d="M22-136c18-38 50-50 78-40"/>
        <path d="M22-136c0-32 10-52 26-62"/>
      </g>
    </g>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>
  <circle cx="930" cy="150" r="64" fill="#FFFFFF" opacity=".75"/>
  <g fill="#FFFFFF" opacity=".85">
    <path d="M150 150a34 34 0 0 1 64-14 44 44 0 0 1 82 14 30 30 0 0 1 4 60H160a30 30 0 0 1-10-60z"/>
    <path d="M640 96a24 24 0 0 1 46-10 32 32 0 0 1 60 10 22 22 0 0 1 2 44H648a22 22 0 0 1-8-44z" opacity=".7"/>
  </g>

  <rect y="380" width="1200" height="370" fill="url(#sea)"/>
