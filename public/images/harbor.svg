<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9E4E8"/>
      <stop offset="1" stop-color="#F4FBFA"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3AB0BD"/>
      <stop offset="1" stop-color="#167D8D"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>
  <circle cx="230" cy="150" r="58" fill="#FFFFFF" opacity=".8"/>
  <path d="M700 120a30 30 0 0 1 58-12 40 40 0 0 1 74 12 28 28 0 0 1 2 56H710a28 28 0 0 1-10-56z" fill="#FFFFFF" opacity=".8"/>

  <!-- distant island -->
  <path d="M760 330c60-20 150-28 230-26s150 12 200 26z" fill="#3BA57E" opacity=".7"/>
  <path d="M720 334h480v10H720z" fill="#F6EFDC" opacity=".9"/>

  <rect y="340" width="1200" height="410" fill="url(#sea)"/>

  <!-- breakwater -->
  <path d="M0 400h420l40 26H0z" fill="#8A9BA6"/>
  <g fill="#A9B7C0">
    <circle cx="60" cy="398" r="16"/><circle cx="118" cy="394" r="18"/><circle cx="182" cy="398" r="15"/>
    <circle cx="246" cy="394" r="18"/><circle cx="312" cy="398" r="16"/><circle cx="372" cy="396" r="17"/>
  </g>
  <rect x="408" y="330" width="10" height="70" fill="#071B2B"/>
  <circle cx="413" cy="322" r="11" fill="#167D8D"/>

  <!-- jetty -->
  <path d="M560 750V520h380v230z" fill="#E6DFCD"/>
  <path d="M560 520h380v22H560z" fill="#CFC6AE"/>
  <g stroke="#B9AF95" stroke-width="3">
    <path d="M560 590h380M560 650h380M560 710h380"/>
  </g>
  <g fill="#071B2B">
    <rect x="590" y="492" width="12" height="34" rx="3"/>
    <rect x="740" y="492" width="12" height="34" rx="3"/>
    <rect x="890" y="492" width="12" height="34" rx="3"/>
  </g>
  <!-- waiting shelter -->
  <g transform="translate(650 400)">
    <rect x="0" y="40" width="200" height="82" fill="#FFFFFF"/>
    <path d="M-22 44l122-44 122 44z" fill="#167D8D"/>
    <rect x="18" y="62" width="42" height="60" fill="#B9E4E8"/>
    <rect x="80" y="62" width="42" height="60" fill="#B9E4E8"/>
    <rect x="142" y="62" width="42" height="60" fill="#B9E4E8"/>
  </g>

  <!-- ferry -->
  <g transform="translate(120 520)">
    <path d="M0 40h330l-36 58H30z" fill="#071B2B"/>
    <rect x="46" y="-8" width="220" height="48" rx="6" fill="#FFFFFF"/>
    <g fill="#167D8D">
      <rect x="64" y="6" width="34" height="20" rx="3"/><rect x="110" y="6" width="34" height="20" rx="3"/>
      <rect x="156" y="6" width="34" height="20" rx="3"/><rect x="202" y="6" width="34" height="20" rx="3"/>
    </g>
    <rect x="96" y="-36" width="90" height="28" rx="5" fill="#FFFFFF"/>
    <path d="M0 62h330" stroke="#B9E4E8" stroke-width="6"/>
  </g>

  <!-- small dhoni -->
  <g transform="translate(980 600)">
    <path d="M0 0c36 12 100 12 150 0l-12 24H18z" fill="#071B2B"/>
    <path d="M132-4c12-10 20-22 22-38-10 6-16 16-22 38z" fill="#071B2B"/>
    <rect x="44" y="-20" width="56" height="20" rx="3" fill="#FFFFFF"/>
  </g>

  <g fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="4" stroke-linecap="round">
    <path d="M40 660c30-12 60-12 90 0s60 12 90 0 60-12 90 0"/>
    <path d="M980 680c30-12 60-12 90 0s60 12 90 0"/>
    <path d="M960 470c30-12 60-12 90 0s60 12 90 0"/>
  </g>
</svg>
