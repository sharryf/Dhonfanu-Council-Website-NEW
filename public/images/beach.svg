<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9EDDE0"/>
      <stop offset="1" stop-color="#F1FAF8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#167D8D"/>
      <stop offset="1" stop-color="#9EDDE0"/>
    </linearGradient>
    <g id="palm">
      <path d="M0 0c-6-70 6-140 34-206" fill="none" stroke="#5A4636" stroke-width="13" stroke-linecap="round"/>
      <g fill="none" stroke="#2F8F6B" stroke-width="14" stroke-linecap="round">
        <path d="M34-206c-40-38-92-38-124-6"/>
        <path d="M34-206c40-40 94-40 130-6"/>
        <path d="M34-206c-26-54-70-72-110-60"/>
        <path d="M34-206c26-56 74-74 116-60"/>
        <path d="M34-206c0-48 14-78 38-92"/>
      </g>
    </g>
    <g id="person">
      <circle cx="0" cy="-64" r="11"/>
      <path d="M-12-50h24l6 44h-10l-2 34h-12l-2-34h-10z"/>
    </g>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>
  <circle cx="960" cy="140" r="70" fill="#FFFFFF" opacity=".8"/>
  <rect y="300" width="1200" height="220" fill="url(#sea)"/>
  <g fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="4" stroke-linecap="round">
    <path d="M620 360c30-12 60-12 90 0s60 12 90 0"/>
    <path d="M880 420c30-12 60-12 90 0s60 12 90 0"/>
    <path d="M500 440c30-12 60-12 90 0s60 12 90 0"/>
  </g>
  <!-- beach -->
  <path d="M0 470c200-40 420-20 640 10s400 20 560-10v280H0z" fill="#F6EFDC"/>
  <path d="M0 470c200-40 420-20 640 10s400 20 560-10" fill="none" stroke="#FFFFFF" stroke-width="10" opacity=".9"/>
  <!-- vegetation -->
  <path d="M0 520c80-40 180-50 270-20 30 60 20 150-10 250H0z" fill="#3BA57E"/>
  <use xlink:href="#palm" href="#palm" transform="translate(120 600)"/>
  <use xlink:href="#palm" href="#palm" transform="translate(250 650) scale(.8) scale(-1 1)"/>

  <!-- volunteers with collection bags -->
  <g fill="#071B2B">
    <use xlink:href="#person" href="#person" transform="translate(520 640) scale(1.5)"/>
    <use xlink:href="#person" href="#person" transform="translate(700 610) scale(1.3)"/>
    <use xlink:href="#person" href="#person" transform="translate(860 650) scale(1.5)"/>
    <use xlink:href="#person" href="#person" transform="translate(1010 600) scale(1.2)"/>
  </g>
  <g fill="#167D8D">
    <path d="M548 610c16 0 24 14 24 34s-10 30-24 30-24-10-24-30 8-34 24-34z" transform="translate(10 0)"/>
    <path d="M886 620c16 0 24 14 24 34s-10 30-24 30-24-10-24-30 8-34 24-34z" transform="translate(10 0)"/>
    <path d="M724 588c13 0 20 12 20 28s-8 24-20 24-20-8-20-24 7-28 20-28z" transform="translate(10 0)"/>
  </g>
  <!-- shells -->
  <g fill="#E3D8BC">
    <circle cx="420" cy="700" r="8"/><circle cx="610" cy="720" r="6"/><circle cx="930" cy="716" r="7"/><circle cx="1100" cy="690" r="6"/>
  </g>
</svg>
